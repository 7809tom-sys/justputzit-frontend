<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Just Putzit</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- PWA Theme & Status Bar -->
    <meta name="theme-color" content="#f97316" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Just Putzit" />
    <link rel="apple-touch-icon" href="/brand/icon-192_c196efd7.png" />

    <!-- SEO / Open Graph / Twitter Card -->
    <meta name="description" content="Just Putzit — meet locals for real dates and activities. Find matches who actually want to go out, not just text. Free to join." />
    <meta name="keywords" content="dating app, local dating, activities, things to do, meet people, date night, social app" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://justputzit.com/" />

    <!-- Open Graph -->
    <meta property="og:title" content="Just Putzit — Real Dates. Real Activities." />
    <meta property="og:description" content="Meet locals who actually want to go out. Find matches for activities, date nights, and real connections in your city." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://justputzit.com/" />
    <meta property="og:image" content="https://justputzit.com/brand/just-putzit-og-image_b5de2dfe.png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:alt" content="Just Putzit — two figures high-fiving above the Just Putzit wordmark" />
    <meta property="og:site_name" content="Just Putzit" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Just Putzit — Real Dates. Real Activities." />
    <meta name="twitter:description" content="Meet locals who actually want to go out. Find matches for activities, date nights, and real connections in your city." />
    <meta name="twitter:image" content="https://justputzit.com/brand/just-putzit-og-image_b5de2dfe.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
